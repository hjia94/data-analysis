<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #1a1f26;
    --muted: #6b7480;
    --rule: #e3e2dc;
    --panel: #fafaf7;
    --warn-edge: #c8922e;
    --warn-bg: #fdf6e7;
    --nan: #b9bcc0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181d;
      --ink: #e8e9e6;
      --muted: #98a0ab;
      --rule: #2b323b;
      --panel: #1b2129;
      --warn-edge: #c1a05e;
      --warn-bg: #2a2418;
      --nan: #4a5057;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem 1.25rem 3rem;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 0.4rem; font-weight: 600; }
  .banner { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.8rem; }
  .warning {
    border-left: 4px solid var(--warn-edge);
    background: var(--warn-bg);
    padding: 0.6rem 0.9rem;
    margin: 0 0 1rem;
    font-size: 0.88rem;
    border-radius: 0 4px 4px 0;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6rem 1rem;
    padding: 0.7rem 0.9rem;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  .controls label { font-size: 0.85rem; color: var(--muted); }
  button, select {
    font: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 0.22rem 0.6rem;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  #frame { flex: 1 1 240px; min-width: 180px; accent-color: #2e7d8f; }
  #axisReadout {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 11ch;
  }
  /* A grid, not a flex row: with flex, a trailing panel that wrapped onto its
     own row was the only item there and grew to the full width, scaling its
     fixed-size canvas bitmap up ~2x and visibly softening the lines. Grid
     tracks are sized by the container, so every panel is the same width
     whether its row is full or not. */
  #panels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 1rem;
  }
  figure {
    margin: 0;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem;
  }
  figcaption {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
    text-align: center;
  }
  /* The width/height attributes are the device-pixel backing store (see
     resizeCanvas), so they no longer give the element its display ratio --
     aspect-ratio does, and it is set from CANVAS_W/CANVAS_H at load. */
  canvas { width: 100%; display: block; }
  #hover {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.8rem;
    font-variant-numeric: tabular-nums;
    min-height: 1.4em;
  }
</style>
</head>
<body>
<main>
  <h1>__TITLE__</h1>
  <p class="banner">__BANNER__</p>
  <p class="warning">__WARNING__</p>

  <div class="controls">
    <label id="groupPick" hidden>Channel
      <select id="group"></select>
    </label>
    <button id="playBtn" type="button">▶ Play</button>
    <button id="prevBtn" type="button">‹</button>
    <button id="nextBtn" type="button">›</button>
    <input id="frame" type="range" min="0" value="0" step="1">
    <span id="axisReadout"></span>
    <label>Scale
      <select id="scaleMode">
        <option value="global">global</option>
        <option value="frame">per frame</option>
      </select>
    </label>
  </div>

  <div id="panels"></div>
  <p id="hover">Hover a panel for the value under the cursor.</p>
</main>

<script>
"use strict";

const DATA = __PAYLOAD__;
const IS_PLANE = DATA.geometry === "plane";

// Canvas geometry. The canvas is drawn at this fixed pixel size and scaled to
// the panel width by CSS, so layout math never depends on the viewport.
const PAD = { left: 58, right: 66, top: 10, bottom: 42 };
const PLOT_W = 420;
const PLOT_H = IS_PLANE ? 360 : 260;
const CANVAS_W = PAD.left + PLOT_W + PAD.right;
const CANVAS_H = PAD.top + PLOT_H + PAD.bottom;

const NAN_COLOR = getComputedStyle(document.documentElement)
  .getPropertyValue("--nan").trim() || "#b9bcc0";
const INK = getComputedStyle(document.documentElement)
  .getPropertyValue("--ink").trim() || "#1a1f26";
const RULE = getComputedStyle(document.documentElement)
  .getPropertyValue("--rule").trim() || "#e3e2dc";

const frameSlider = document.getElementById("frame");
const groupSelect = document.getElementById("group");
const scaleSelect = document.getElementById("scaleMode");
const axisReadout = document.getElementById("axisReadout");
const hoverOut = document.getElementById("hover");

// Cache of global (all-frame) limits, keyed "<group>:<panel>" -- limits belong
// to one channel's data, so they cannot be shared across the dropdown.
const globalLimits = new Map();
let playTimer = null;

/** The group (channel/run) currently selected in the dropdown. */
function currentGroup() {
  return DATA.groups[+groupSelect.value];
}

/**
 * The axis the slider is scrubbing: the selected group's own if it has one,
 * else the bundle's. Groups recorded over different spans carry their own;
 * groups that share one (every channel of an xcorr page) leave it off, so the
 * array ships once rather than once per group.
 */
function currentAxis() {
  return currentGroup().axis || DATA.axis;
}

/** Every trace cube on panel `p`, for the selected group. */
function cubesFor(p) {
  return currentGroup().frames[p];
}

// Trace colours: sampled from each panel's own colormap so a two-curve panel
// stays within the palette its single-curve form already used. Endpoints are
// avoided -- several colormaps run to near-white or near-black there, which
// disappears against the plot ground.
const TRACE_STOPS = [0.62, 0.20, 0.85, 0.42];

function traceColor(panel, p, t) {
  return lutColor(lutColors(panel, p), TRACE_STOPS[t % TRACE_STOPS.length]);
}

// ---------------------------------------------------------------- utilities

function isNum(v) {
  return v !== null && Number.isFinite(v);
}

/** Format a value for display: fixed for ordinary magnitudes, else exponential. */
function fmt(v) {
  if (!isNum(v)) return "—";
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(2);
  return v.toFixed(a >= 100 ? 1 : 3);
}

/**
 * Fold one frame's finite values into a running [lo, hi], allocating nothing.
 * Frames are 2-D (plane) or 1-D (line). This runs on every slider drag for
 * autoscaled fields, so it never builds an intermediate array.
 */
function foldExtent(frame, acc) {
  const rows = IS_PLANE ? frame : [frame];
  for (const row of rows) {
    for (const v of row) {
      if (!isNum(v)) continue;
      if (v < acc[0]) acc[0] = v;
      if (v > acc[1]) acc[1] = v;
    }
  }
  return acc;
}

/** A usable [lo, hi] from a folded accumulator, widening a degenerate range. */
function finishExtent(acc) {
  if (acc[0] > acc[1]) return [0, 1];                 // no finite samples
  if (acc[0] === acc[1]) return [acc[0] - 0.5, acc[1] + 0.5];
  return acc;
}

/**
 * Colour limits for panel `p` at frame index `i`.
 * A panel carrying vmin/vmax is on a fixed physical scale (coherence 0..1,
 * phase ±180) and ignores the toggle -- and, being fixed, it is also the one
 * case where two channels stay directly comparable across a switch. Otherwise
 * the toggle chooses between this frame's range and the range across all
 * frames, both taken within the selected channel.
 */
function limitsFor(panel, p, i) {
  if (panel.vmin !== null && panel.vmax !== null) return [panel.vmin, panel.vmax];
  // Every trace on a panel shares one y-axis, so the limits fold over all of
  // them: scaling to one curve would push the others off the plot.
  const cubes = cubesFor(p);
  if (scaleSelect.value === "frame") {
    const acc = [Infinity, -Infinity];
    for (const cube of cubes) foldExtent(cube[i], acc);
    return finishExtent(acc);
  }
  const key = `${groupSelect.value}:${p}`;
  if (!globalLimits.has(key)) {
    const acc = [Infinity, -Infinity];
    for (const cube of cubes) for (const frame of cube) foldExtent(frame, acc);
    globalLimits.set(key, finishExtent(acc));
  }
  return globalLimits.get(key);
}

// Each panel's LUT as ready-made CSS colors, built once. The plane raster sets
// fillStyle per cell on every drag, so formatting the string there would churn
// thousands of short-lived strings per frame. Panels are shared by every
// channel, so switching the dropdown reuses these rather than rebuilding them.
const lutStrings = new Map();

function lutColors(panel, p) {
  if (!lutStrings.has(p)) {
    lutStrings.set(p, panel.lut.map(c => `rgb(${c[0]},${c[1]},${c[2]})`));
  }
  return lutStrings.get(p);
}

/** Look a normalized value up in a prepared color table. */
function lutColor(colors, t) {
  const clamped = Math.max(0, Math.min(1, t));
  return colors[Math.round(clamped * (colors.length - 1))];
}

// ------------------------------------------------------------------ drawing

/** Shared axis chrome: frame box, tick labels, axis titles. */
function drawAxes(ctx, xTicks, xLabel, yTicks, yLabel) {
  ctx.strokeStyle = RULE;
  ctx.lineWidth = 1;
  ctx.strokeRect(PAD.left, PAD.top, PLOT_W, PLOT_H);

  ctx.fillStyle = INK;
  ctx.font = "11px system-ui, sans-serif";
  ctx.textAlign = "center";
  for (const tick of xTicks) {
    ctx.fillText(tick.text, tick.pos, PAD.top + PLOT_H + 15);
  }
  ctx.fillText(xLabel, PAD.left + PLOT_W / 2, PAD.top + PLOT_H + 34);

  ctx.textAlign = "right";
  for (const tick of yTicks) {
    ctx.fillText(tick.text, PAD.left - 7, tick.pos + 4);
  }
  ctx.save();
  ctx.translate(13, PAD.top + PLOT_H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.fillText(yLabel, 0, 0);
  ctx.restore();
}

/** Vertical colorbar with its low/high labels, at the right of the plot box. */
function drawColorbar(ctx, colors, lo, hi) {
  const barX = PAD.left + PLOT_W + 12;
  const barW = 13;
  const steps = 128;
  for (let s = 0; s < steps; s++) {
    ctx.fillStyle = lutColor(colors, 1 - s / (steps - 1));
    ctx.fillRect(barX, PAD.top + s * PLOT_H / steps, barW, PLOT_H / steps + 1);
  }
  ctx.strokeStyle = RULE;
  ctx.strokeRect(barX, PAD.top, barW, PLOT_H);

  ctx.fillStyle = INK;
  ctx.font = "10px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(fmt(hi), barX + barW + 4, PAD.top + 8);
  ctx.fillText(fmt(lo), barX + barW + 4, PAD.top + PLOT_H - 1);
}

/**
 * Decimals needed to keep neighbouring ticks distinguishable.
 * Precision follows the *spacing* of the values, not their magnitude: a 0.1 cm
 * scan pitch printed to one decimal renders "-0.8" twice at different
 * positions, which reads as a plotting error.
 */
function tickDecimals(step) {
  if (!Number.isFinite(step) || step <= 0) return 1;
  // Enough digits to distinguish adjacent ticks, and no more: a step of 10
  // prints "-30", a step of 0.5 prints "-0.5".
  return Math.min(4, Math.max(0, -Math.floor(Math.log10(step))));
}

/**
 * One tick's label. Plain decimal where that reads, exponential where it does
 * not -- an ne axis stepping by 2e12 would otherwise print 13-digit runs of
 * zeros. Same thresholds as `fmt`, so ticks and the hover readout agree.
 */
function tickText(v, decimals) {
  if (Object.is(v, -0)) v = 0;                   // "-0" is never wanted
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(2);
  return v.toFixed(decimals);
}

/**
 * The densest "nice" tick step for `span` that yields at most `max` ticks.
 *
 * Ticks are chosen in *data* space rather than by walking the sample array,
 * which is what puts them on round numbers and keeps them symmetric about
 * zero. Striding the array by index instead made the labels fall wherever the
 * samples happened to land -- a -30..30 line scan of 61 points ticked at
 * -30, -21, -12, -3, 6, 15, 24: no zero, and not symmetric.
 *
 * The ladder is walked upward from below the span and the first fitting step
 * wins, rather than rounding the average spacing up. Rounding up overshoots on
 * spans that sit just above a rung -- the -8..8 xcorr axis took a step of 5 and
 * showed only -5, 0, 5, dropping both endpoints. Every rung stays a 1/2/5
 * multiple, so an integer axis never picks up fractional labels.
 *
 * Candidates are judged by the ticks actually drawn between `lo` and `hi`, not
 * by the span alone. Ticks land on multiples of the step, so where they fall
 * relative to the ends matters: -9..9 holds three multiples of 5 but -8..8
 * holds nine multiples of 2, and a span-only estimate rates the wider axis as
 * the denser one and picks the coarser step for both.
 */
function niceStep(lo, hi, max) {
  const drawn = step =>
    Math.floor(Math.max(lo, hi) / step + 1e-9) -
    Math.ceil(Math.min(lo, hi) / step - 1e-9) + 1;
  // Starting one decade below the average spacing, a fitting rung is always
  // found within two decades -- the ladder only has to climb far enough to
  // undo that deliberate undershoot.
  const start = Math.floor(Math.log10(Math.abs(hi - lo) / max)) - 1;
  for (let e = start; e <= start + 3; e++) {
    for (const m of [1, 2, 5]) {
      const step = m * Math.pow(10, e);
      if (drawn(step) <= max) return step;
    }
  }
  return Math.abs(hi - lo);                    // one tick per end; never hit
}

// Ticks depend only on the spatial axes and the fixed canvas geometry, neither
// of which changes after load -- so they are built once rather than rebuilt on
// every slider drag, like globalLimits and lutStrings above. `key` names which
// axis of which panel type is being drawn, because the same values array (x) is
// placed by a different toPixel in the plane and line paths.
const tickCache = new Map();

/**
 * Tick marks on round values along a coordinate array, at most `max` of them.
 *
 * `toPixel` is called with a *fractional* index, since a round value generally
 * falls between samples. Every axis places samples linearly, so interpolating
 * the index is exact rather than an approximation.
 */
function niceTicks(lo, hi, max, toPixel) {
  if (lo === hi) {                                 // degenerate: label the one
    return [{ text: tickText(lo, 1), pos: toPixel(lo) }];
  }
  const step = niceStep(lo, hi, max);
  const decimals = tickDecimals(step);
  const ticks = [];
  const first = Math.ceil(Math.min(lo, hi) / step) * step;
  for (let v = first; v <= Math.max(lo, hi) + step * 1e-9; v += step) {
    // -0 prints as "-0"; normalize it away.
    ticks.push({ text: tickText(v, decimals), pos: toPixel(v) });
  }
  return ticks;
}

/**
 * Ticks along a sample array, cached: same as :func:`niceTicks`, but `toPixel`
 * is the array's index-to-pixel map, so values are converted to a fractional
 * index first. Every axis places samples linearly, so interpolating the index
 * is exact rather than an approximation.
 */
function ticksFor(key, values, max, toPixel) {
  const cached = tickCache.get(key);
  if (cached) return cached;
  const lo = values[0], hi = values[values.length - 1];
  const sampleStep = values.length > 1 ? (hi - lo) / (values.length - 1) : 1;
  const ticks = niceTicks(lo, hi, max, v => toPixel((v - lo) / sampleStep));
  tickCache.set(key, ticks);
  return ticks;
}

/** Cell size of the plane raster. Draw and hover must agree on this. */
function cellSize() {
  return { cw: PLOT_W / DATA.x.values.length, ch: PLOT_H / DATA.y.values.length };
}

/**
 * Grid indices under a canvas point, or null outside the plot box.
 * The inverse of drawPlanePanel's placement, including the row flip that puts
 * row 0 (lowest y) at the bottom -- so the two share one origin convention.
 */
function cellAt(mx, my) {
  const { cw, ch } = cellSize();
  const nx = DATA.x.values.length;
  const ny = DATA.y.values.length;
  const ix = Math.floor((mx - PAD.left) / cw);
  const iy = ny - 1 - Math.floor((my - PAD.top) / ch);
  if (ix < 0 || ix >= nx || iy < 0 || iy >= ny) return null;
  return { ix, iy };
}

/** A plane panel: one filled rectangle per grid cell, NaN cells grey. */
function drawPlanePanel(ctx, panel, p, i) {
  // A plane field is single-trace by validation, so there is only ever cube 0.
  const frame = cubesFor(p)[0][i];
  const [lo, hi] = limitsFor(panel, p, i);
  const span = hi - lo || 1;
  const colors = lutColors(panel, p);
  const nx = DATA.x.values.length;
  const ny = DATA.y.values.length;
  const { cw, ch } = cellSize();

  for (let iy = 0; iy < ny; iy++) {
    // Row 0 is the lowest y, drawn at the bottom (matplotlib origin="lower").
    const top = PAD.top + (ny - 1 - iy) * ch;
    for (let ix = 0; ix < nx; ix++) {
      const v = frame[iy][ix];
      ctx.fillStyle = isNum(v) ? lutColor(colors, (v - lo) / span) : NAN_COLOR;
      // +0.5 overdraw closes hairline seams between neighbouring cells.
      ctx.fillRect(PAD.left + ix * cw, top, cw + 0.5, ch + 0.5);
    }
  }

  drawAxes(ctx,
    ticksFor("plane-x", DATA.x.values, 9, i2 => PAD.left + (i2 + 0.5) * cw),
    `${DATA.x.label} [${DATA.x.unit}]`,
    ticksFor("plane-y", DATA.y.values, 9, i2 => PAD.top + (ny - 1 - i2 + 0.5) * ch),
    `${DATA.y.label} [${DATA.y.unit}]`);
  drawColorbar(ctx, colors, lo, hi);
}

/**
 * A line panel: one profile polyline per trace, with gaps where data is NaN.
 * Traces share the panel's y-axis (see limitsFor), which is what makes them
 * comparable -- two tips of the same quantity read against one scale.
 */
function drawLinePanel(ctx, panel, p, i) {
  const cubes = cubesFor(p);
  const [lo, hi] = limitsFor(panel, p, i);
  const span = hi - lo || 1;
  const xs = DATA.x.values;
  const toX = j => PAD.left + (xs.length === 1 ? PLOT_W / 2 : j * PLOT_W / (xs.length - 1));
  const toY = v => PAD.top + PLOT_H - (v - lo) * PLOT_H / span;

  ctx.lineWidth = 2;
  cubes.forEach((cube, t) => {
    const frame = cube[i];
    ctx.strokeStyle = traceColor(panel, p, t);
    ctx.beginPath();
    let pen = false;
    for (let j = 0; j < frame.length; j++) {
      if (!isNum(frame[j])) { pen = false; continue; }   // NaN breaks the line
      const px = toX(j), py = toY(frame[j]);
      if (pen) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      pen = true;
    }
    ctx.stroke();
  });

  drawAxes(ctx,
    ticksFor("line-x", xs, 9, toX),
    `${DATA.x.label} [${DATA.x.unit}]`,
    // Round values here too, not five equal divisions of the range: the y-axis
    // is what two overlaid traces are compared against. Uncached -- unlike the
    // spatial axes, these limits change with the frame.
    niceTicks(lo, hi, 6, toY),
    panel.unit ? `${panel.name} [${panel.unit}]` : panel.name);

  // A legend only where there is something to tell apart.
  if (panel.traces.length > 1) drawTraceLegend(ctx, panel, p);
}

/** Key for a multi-trace panel: a short colour swatch and name per trace. */
function drawTraceLegend(ctx, panel, p) {
  const pad = 8, lineH = 15, swatch = 18;
  ctx.font = "12px system-ui, sans-serif";
  const width = swatch + 6 + Math.max(...panel.traces.map(n => ctx.measureText(n).width));
  const x = PAD.left + PLOT_W - width - pad;
  const y = PAD.top + pad;

  ctx.fillStyle = "rgba(255,255,255,0.82)";
  ctx.fillRect(x - 6, y - 4, width + 12, panel.traces.length * lineH + 8);
  ctx.strokeStyle = "#c8c8c8";
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 6, y - 4, width + 12, panel.traces.length * lineH + 8);

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  panel.traces.forEach((name, t) => {
    const cy = y + t * lineH + lineH / 2;
    ctx.strokeStyle = traceColor(panel, p, t);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, cy);
    ctx.lineTo(x + swatch, cy);
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.fillText(name, x + swatch + 6, cy);
  });
}

// ------------------------------------------------------------ panel assembly

// Panels are the same for every channel (validation enforces it), so the DOM is
// built once at load. Switching channels only changes which cube is drawn into
// these canvases -- no teardown, no re-created listeners, no layout reflow.
const panelHost = document.getElementById("panels");
const contexts = DATA.panels.map((panel, p) => {
  const figure = document.createElement("figure");
  const caption = document.createElement("figcaption");
  caption.textContent = panel.unit ? `${panel.name} [${panel.unit}]` : panel.name;

  // The canvas is laid out by CSS at whatever width its grid track gives it,
  // but its backing store is sized in device pixels: CSS width x the display's
  // pixel ratio. Drawing at 1x and letting the browser upscale is what makes
  // lines and text look soft on a HiDPI screen or a wide panel.
  const canvas = document.createElement("canvas");
  canvas.style.aspectRatio = `${CANVAS_W} / ${CANVAS_H}`;
  canvas.addEventListener("mousemove", e => reportHover(e, canvas, panel, p));
  canvas.addEventListener("mouseleave", () => { hoverOut.textContent = ""; });

  figure.append(caption, canvas);
  panelHost.append(figure);
  return canvas.getContext("2d");
});

/** Report the data value under the cursor, in data coordinates. */
function reportHover(event, canvas, panel, p) {
  const rect = canvas.getBoundingClientRect();
  const mx = (event.clientX - rect.left) * CANVAS_W / rect.width;
  const my = (event.clientY - rect.top) * CANVAS_H / rect.height;
  if (mx < PAD.left || mx > PAD.left + PLOT_W ||
      my < PAD.top || my > PAD.top + PLOT_H) {
    hoverOut.textContent = "";
    return;
  }

  const i = +frameSlider.value;
  const xs = DATA.x.values;

  if (IS_PLANE) {
    const cell = cellAt(mx, my);
    if (!cell) { hoverOut.textContent = ""; return; }
    const { ix, iy } = cell;
    // Each coordinate carries its own unit: the schema allows x and y to
    // differ, so labelling both with x's would misreport the y position.
    hoverOut.textContent =
      `${panel.name} at (${xs[ix].toFixed(1)} ${DATA.x.unit}, ` +
      `${DATA.y.values[iy].toFixed(1)} ${DATA.y.unit}) ` +
      `= ${fmt(frame[iy][ix])}${panel.unit ? " " + panel.unit : ""}`;
  } else {
    const j = Math.round((mx - PAD.left) / PLOT_W * (xs.length - 1));
    const clamped = Math.max(0, Math.min(xs.length - 1, j));
    // Report every trace at the hovered position: with two curves on a panel,
    // reading only the first would answer the wrong half of the question.
    const unit = panel.unit ? " " + panel.unit : "";
    const reads = cubesFor(p).map((cube, t) => {
      const value = `${fmt(cube[i][clamped])}${unit}`;
      return panel.traces.length > 1 ? `${panel.traces[t]} ${value}` : value;
    });
    hoverOut.textContent =
      `${panel.name} at ${xs[clamped].toFixed(1)} ${DATA.x.unit} = ` +
      reads.join(",  ");
  }
}

// -------------------------------------------------------------------- render

function render() {
  const axis = currentAxis();
  // Groups may differ in frame count, so the slider is re-bounded on every
  // render rather than once at load. The index is preserved where it fits and
  // clamped where it does not -- switching to a shorter run lands on its last
  // frame instead of silently reading past the end.
  frameSlider.max = axis.values.length - 1;
  if (+frameSlider.value > +frameSlider.max) frameSlider.value = frameSlider.max;
  const i = +frameSlider.value;
  axisReadout.textContent =
    `${axis.name} ${fmt(axis.values[i])} ${axis.unit}`;

  DATA.panels.forEach((panel, p) => {
    const ctx = contexts[p];
    resizeCanvas(ctx);
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    if (IS_PLANE) drawPlanePanel(ctx, panel, p, i);
    else drawLinePanel(ctx, panel, p, i);
  });
}

/**
 * Match a canvas's backing store to the pixels it actually occupies, then scale
 * the context so all drawing code keeps working in CANVAS_W x CANVAS_H units.
 *
 * Done per render rather than once at load because the size depends on the
 * window: the grid re-flows from two columns to one, and the page can move
 * between displays of different pixel ratios.
 */
function resizeCanvas(ctx) {
  const canvas = ctx.canvas;
  const cssW = canvas.clientWidth;
  if (!cssW) return;                       // not laid out yet (display:none)
  // Capped because the backing store costs width x height x 4 bytes per panel,
  // and past ~2x the extra detail is beyond what a display resolves.
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const target = Math.round(cssW * dpr);
  if (canvas.width !== target) {
    canvas.width = target;
    canvas.height = Math.round(target * CANVAS_H / CANVAS_W);
  }
  // setTransform, not scale: this runs every render and scale() would compound.
  ctx.setTransform(canvas.width / CANVAS_W, 0, 0, canvas.width / CANVAS_W, 0, 0);
}

// Re-draw when the panel width changes: the grid re-flows at breakpoints, and
// a stale backing store would be stretched until the next slider move.
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 100);
});

function step(delta) {
  const n = currentAxis().values.length;
  frameSlider.value = (+frameSlider.value + delta + n) % n;
  render();
}

function togglePlay() {
  const button = document.getElementById("playBtn");
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
    button.textContent = "▶ Play";
  } else {
    playTimer = setInterval(() => step(1), 220);
    button.textContent = "❚❚ Pause";
  }
}

DATA.groups.forEach((group, g) => {
  const option = document.createElement("option");
  option.value = g;
  option.textContent = group.name || `group ${g + 1}`;
  groupSelect.append(option);
});
// A one-channel page has nothing to pick between; hide the control rather than
// showing a dropdown with a single entry.
if (DATA.groups.length > 1) document.getElementById("groupPick").hidden = false;

frameSlider.addEventListener("input", render);
// The frame index deliberately survives a group switch: holding the slider
// still and swapping what is under it is the comparison this page exists to
// make. Where groups differ in length the index, not the axis value, is what
// carries over -- render() clamps it and the readout always shows the real
// value for the group now selected.
groupSelect.addEventListener("change", render);
scaleSelect.addEventListener("change", render);
document.getElementById("playBtn").addEventListener("click", togglePlay);
document.getElementById("prevBtn").addEventListener("click", () => step(-1));
document.getElementById("nextBtn").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});

// An empty warning placeholder leaves a stray banner; drop it.
const warningEl = document.querySelector(".warning");
if (!warningEl.textContent.trim()) warningEl.remove();

render();
</script>
</body>
</html>
